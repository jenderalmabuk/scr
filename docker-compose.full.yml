        condition: service_started
    restart: unless-stopped
    profiles: ["fusion-quantum-paper"]
    networks:
      - nexus_net
      - docker_default

  # Isolated H4+15m validation runner. Never included by "bots" profile.
  # Start explicitly: docker compose --profile fusion-quantum-paper up -d fusion_quantum_gateway fusion_quantum_paper
  fusion_quantum_paper:
    image: nexus-bot:latest
    container_name: nexus_fusion_quantum_paper
    command: ["python", "-u", "-m", "fusion_quantum.paper_runner"]
    user: "1000:1000"
    environment:
      PYTHONUNBUFFERED: "1"
      NEXUS_API_URL: http://fastapi:8000
      GATEWAY_URL: http://fusion_quantum_gateway:8790/gateway
      GATEWAY_TOKEN: ${FQ_GATEWAY_TOKEN:-${GATEWAY_TOKEN}}
      FQ_RUNTIME_DIR: /state
      FQ_PAPER_AUDIT: /state/paper_gateway_audit.jsonl
      FQ_UNIVERSE_FILE: /app/runtime/revo/canonical_universe.txt
      FQ_POLL_SEC: ${FQ_POLL_SEC:-300}
      FQ_FIB_EXPIRY: ${FQ_FIB_EXPIRY:-6}
      FQ_TELEGRAM_BOT_TOKEN: ${FQ_TELEGRAM_BOT_TOKEN:-}
      FQ_TELEGRAM_CHAT_ID: ${FQ_TELEGRAM_CHAT_ID:-}
      LOG_DIR: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ../runtime/fusion_quantum:/state
      - ../runtime/revo:/app/runtime/revo:ro
    depends_on:
      fastapi:
        condition: service_started
      fusion_quantum_gateway:
        condition: service_started
    restart: unless-stopped
    profiles: ["fusion-quantum-paper"]
    networks:
      - nexus_net
      - docker_default

networks:
  nexus_net:
    external: true
  docker_default:
    external: true

volumes:
  timescale_data:
    driver: local
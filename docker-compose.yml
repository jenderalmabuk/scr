services:
  oi_rollup:
    image: signalcopyreal-oi_rollup:latest
    container_name: nexus_oi_rollup
    command: ["python", "-u", "-m", "collector"]
    environment:
      DATABASE_URL: postgresql://nexus:${NEXUS_DB_PASSWORD:?NEXUS_DB_PASSWORD is required}@timescaledb:5432/nexus
      COLLECTOR_MODE: oi_rollup
    restart: unless-stopped
    networks:
      - docker_default

  gateway:
    image: nexus-bot:latest
    container_name: nexus_gateway
    env_file:
      - .env
    command: ["python", "-u", "-m", "uvicorn", "gateway.run_gateway:app", "--host", "0.0.0.0", "--port", "8787"]
    user: "1000:1000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?GATEWAY_TOKEN is required}
      GATEWAY_TRADER_MODE: ${GATEWAY_TRADER_MODE:-bybit}
      GATEWAY_PAPER_MAINNET: ${GATEWAY_PAPER_MAINNET:-false}
      BYBIT_API_KEY: ${BYBIT_API_KEY:?BYBIT_API_KEY is required}
      BYBIT_SECRET: ${BYBIT_SECRET:?BYBIT_SECRET is required}
      PAPER_NEXUS_API: http://fastapi:8000
      BOT_JOURNAL_DIR: /app/journal
      FQ_PAPER_POSITION_STATE: /app/journal/open_positions.json
      FQ_PAPER_EQUITY_STATE: /app/journal/paper_equity.json
      SIGNALCOPY_CAPITAL: ${SIGNALCOPY_CAPITAL:-100}
      SIGNALCOPY_RISK_PER_TRADE_USD: ${SIGNALCOPY_RISK_PER_TRADE_USD:-2}
      SIGNALCOPY_MAX_LEVERAGE: ${SIGNALCOPY_MAX_LEVERAGE:-10}
      SIGNALCOPY_MAX_CONCURRENT: ${SIGNALCOPY_MAX_CONCURRENT:-10}
      REAL_MAX_RUNNING_POSITIONS: ${REAL_MAX_RUNNING_POSITIONS:-20}
      MAX_SAME_DIRECTION_POS: ${MAX_SAME_DIRECTION_POS:-0}
      MAX_TOTAL_EXPOSURE_PCT: ${MAX_TOTAL_EXPOSURE_PCT:-100000.0}
      MAX_GLOBAL_OPEN_RISK_PCT: ${MAX_GLOBAL_OPEN_RISK_PCT:-0.10}
      SIGNALCOPY_BYBIT_DYNAMIC_EXIT: ${SIGNALCOPY_BYBIT_DYNAMIC_EXIT:-true}
      SCRATCH_EXIT_ENABLED: ${SCRATCH_EXIT_ENABLED:-true}
      SCRATCH_EXIT_RANGING_MINUTES: ${SCRATCH_EXIT_RANGING_MINUTES:-30}
      SCRATCH_EXIT_TRENDING_MINUTES: ${SCRATCH_EXIT_TRENDING_MINUTES:-45}
      SCRATCH_EXIT_MAX_ABS_PNL_PCT: ${SCRATCH_EXIT_MAX_ABS_PNL_PCT:-0.4}
      DAMAGE_REDUCER_ENABLED: ${DAMAGE_REDUCER_ENABLED:-true}
      DAMAGE_REDUCER_MIN_HOLD_MINUTES: ${DAMAGE_REDUCER_MIN_HOLD_MINUTES:-45}
      DAMAGE_REDUCER_MAX_LOSS_PCT: ${DAMAGE_REDUCER_MAX_LOSS_PCT:--2.5}
      DAMAGE_REDUCER_PROFIT_GUARD_ENABLED: ${DAMAGE_REDUCER_PROFIT_GUARD_ENABLED:-true}
      DAMAGE_REDUCER_PROFIT_GUARD_MIN_R: ${DAMAGE_REDUCER_PROFIT_GUARD_MIN_R:-0.30}
      DAMAGE_REDUCER_MIN_REVERSAL_SIGNALS: ${DAMAGE_REDUCER_MIN_REVERSAL_SIGNALS:-2}
      DAMAGE_REVERSAL_FIRST_MIN_R: ${DAMAGE_REVERSAL_FIRST_MIN_R:--0.20}
      DAMAGE_REVERSAL_FIRST_SIGNALS: ${DAMAGE_REVERSAL_FIRST_SIGNALS:-3}
      DAMAGE_REDUCER_PARTIAL_FRACTION: ${DAMAGE_REDUCER_PARTIAL_FRACTION:-0.50}
      DAMAGE_MFE_GIVEBACK_ENABLED: ${DAMAGE_MFE_GIVEBACK_ENABLED:-true}
      DAMAGE_MFE_GIVEBACK_MIN_MFE_R: ${DAMAGE_MFE_GIVEBACK_MIN_MFE_R:-0.50}
      DAMAGE_MFE_GIVEBACK_EXIT_R: ${DAMAGE_MFE_GIVEBACK_EXIT_R:--0.15}
      DAMAGE_LOCAL_BOTTOM_GUARD_ENABLED: ${DAMAGE_LOCAL_BOTTOM_GUARD_ENABLED:-true}
      DAMAGE_LOCAL_BOTTOM_BOUNCE_R: ${DAMAGE_LOCAL_BOTTOM_BOUNCE_R:-0.15}
      DAMAGE_LOCAL_BOTTOM_BYPASS_SIGNALS: ${DAMAGE_LOCAL_BOTTOM_BYPASS_SIGNALS:-4}
      MANUAL_DAMAGE_MIN_REVERSAL_SIGNALS: ${MANUAL_DAMAGE_MIN_REVERSAL_SIGNALS:-3}
      MANUAL_DAMAGE_EMERGENCY_R: ${MANUAL_DAMAGE_EMERGENCY_R:--1.10}
      PROFIT_LOCK_ENABLED: ${PROFIT_LOCK_ENABLED:-true}
      PROFIT_LOCK_MIN_MINUTES: ${PROFIT_LOCK_MIN_MINUTES:-15}
      PROFIT_LOCK_BUFFER_PCT: ${PROFIT_LOCK_BUFFER_PCT:-0.3}
      TRAIL_SL_ENABLED: ${TRAIL_SL_ENABLED:-true}
      TRAIL_SL_PCT: ${TRAIL_SL_PCT:-0.8}
      TRAIL_SL_ATR_MULTIPLIER: ${TRAIL_SL_ATR_MULTIPLIER:-1.5}
      TRAILING_EXECUTION_ENABLED: "true"
      SHADOW_TRAILING_ENABLED: ${SHADOW_TRAILING_ENABLED:-true}
      SHADOW_TRAILING_JOURNAL: /app/journal/shadow_trailing.jsonl
      SIGNAL_COPY_TRADES_NOTIFY_BOT_TOKEN: ${SIGNAL_COPY_TRADES_NOTIFY_BOT_TOKEN:-}
      SIGNAL_COPY_TRADES_NOTIFY_CHAT_ID: ${SIGNAL_COPY_TRADES_NOTIFY_CHAT_ID:-0}
      SIGNAL_COPY_PARSER_NOTIFY_BOT_TOKEN: ${SIGNAL_COPY_PARSER_NOTIFY_BOT_TOKEN:-}
      SIGNAL_COPY_PARSER_NOTIFY_CHAT_ID: ${SIGNAL_COPY_PARSER_NOTIFY_CHAT_ID:-0}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./risk:/app/risk
      - ./journal:/app/journal
      - ./execution:/app/execution
      - ./gateway:/app/gateway
      - ./runtime/whales:/app/runtime/whales:ro
      - ./runtime/revo:/app/runtime/revo:ro
    restart: unless-stopped
    networks:
      - docker_default

  signal_copy:
    image: signalcopyreal-signal_copy:latest
    container_name: nexus_signal_copy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      NEXUS_API_URL: http://fastapi:8000
      LOG_DIR: /tmp
      MPLCONFIGDIR: /tmp/matplotlib
      SIGNAL_COPY_TG_API_ID: ${TELEGRAM_API_ID:?TELEGRAM_API_ID is required}
      SIGNAL_COPY_TG_API_HASH: ${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required}
      SIGNAL_COPY_TG_SESSION: ${TELEGRAM_SESSION_NAME:-/state/signal_copy_session}
      SIGNAL_COPY_TG_LISTENER_BOT_TOKEN: ${SIGNAL_COPY_TG_LISTENER_BOT_TOKEN:-}
      SIGNAL_COPY_TG_CHANNELS: ${SIGNAL_COPY_TG_CHANNELS}
      SIGNAL_COPY_CALIBRATION_CHANNELS: ${SIGNAL_COPY_CALIBRATION_CHANNELS:-}
      SIGNAL_COPY_CHANNELS_SCALP: ${SIGNAL_COPY_CHANNELS_SCALP:-}
      SIGNAL_COPY_CHANNELS_SWING: ${SIGNAL_COPY_CHANNELS_SWING:-}
      SIGNAL_COPY_CHANNELS_VISION: ${SIGNAL_COPY_CHANNELS_VISION:-}
      SIGNAL_COPY_EXPIRY_SCALP: ${SIGNAL_COPY_EXPIRY_SCALP:-2700}
      SIGNAL_COPY_EXPIRY_STANDARD: ${SIGNAL_COPY_EXPIRY_STANDARD:-10800}
      SIGNAL_COPY_EXPIRY_SWING: ${SIGNAL_COPY_EXPIRY_SWING:-64800}
      SIGNAL_COPY_PARSER_NOTIFY_BOT_TOKEN: ${SIGNAL_COPY_PARSER_NOTIFY_BOT_TOKEN}
      SIGNAL_COPY_PARSER_NOTIFY_CHAT_ID: ${SIGNAL_COPY_PARSER_NOTIFY_CHAT_ID}
      SIGNAL_COPY_TRADES_NOTIFY_BOT_TOKEN: ${SIGNAL_COPY_TRADES_NOTIFY_BOT_TOKEN}
      SIGNAL_COPY_TRADES_NOTIFY_CHAT_ID: ${SIGNAL_COPY_TRADES_NOTIFY_CHAT_ID}
      SIGNAL_COPY_CONFIRM_BOT_TOKEN: ${SIGNAL_COPY_CONFIRM_BOT_TOKEN:-}
      SIGNAL_COPY_CONFIRM_CHAT_ID: ${SIGNAL_COPY_CONFIRM_CHAT_ID:-}
      SIGNAL_COPY_RISK_PCT: ${SIGNAL_COPY_RISK_PCT:-0.01}
      SIGNAL_COPY_DRY_RUN: ${SIGNAL_COPY_DRY_RUN:-true}
      SIGNAL_COPY_AUTO_EXECUTE: ${SIGNAL_COPY_AUTO_EXECUTE:-false}
      SIGNAL_COPY_MAX_RUNNING_POSITIONS: ${SIGNAL_COPY_MAX_RUNNING_POSITIONS:-30}
      MAX_OPEN_POS_GLOBAL: ${MAX_OPEN_POS_GLOBAL:-20}
      GATEWAY_URL: ${GATEWAY_URL:-http://gateway:8787/gateway}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?GATEWAY_TOKEN is required}
      SIGNAL_COPY_LEGACY_VALIDATION: ${SIGNAL_COPY_LEGACY_VALIDATION:-false}
      SIGNAL_COPY_VALID_THRESHOLD: ${SIGNAL_COPY_VALID_THRESHOLD:-60}
      SIGNAL_COPY_WEAK_THRESHOLD: ${SIGNAL_COPY_WEAK_THRESHOLD:-45}
      SIGNAL_COPY_AUTO_MARKET_MIN_SCORE: ${SIGNAL_COPY_AUTO_MARKET_MIN_SCORE:-65}
      ADVERSARIAL_DYNAMIC_SIZING_ENABLED: ${ADVERSARIAL_DYNAMIC_SIZING_ENABLED:-true}
      ADVERSARIAL_SIZING_MAX_RISK_USD: ${ADVERSARIAL_SIZING_MAX_RISK_USD:-2.0}
      ADVERSARIAL_SIZING_MIN_RISK_USD: ${ADVERSARIAL_SIZING_MIN_RISK_USD:-0.5}
      ADVERSARIAL_SIZING_VETO_ENABLED: ${ADVERSARIAL_SIZING_VETO_ENABLED:-true}
      SIGNAL_COPY_AUTO_LIMIT_MIN_SCORE: ${SIGNAL_COPY_AUTO_LIMIT_MIN_SCORE:-55}
      SIGNAL_COPY_ADVERSARIAL_NO_OVERRIDE_MIN_SCORE: ${SIGNAL_COPY_ADVERSARIAL_NO_OVERRIDE_MIN_SCORE:-75}
      SIGNAL_COPY_COMMITTEE_WARN_DOWNGRADE_COUNT: ${SIGNAL_COPY_COMMITTEE_WARN_DOWNGRADE_COUNT:-2}
      SIGNAL_COPY_CHANNEL_SCORE_BONUS: ${SIGNAL_COPY_CHANNEL_SCORE_BONUS:-}
      SIGNAL_COPY_CHANNEL_SCORE_PENALTY: ${SIGNAL_COPY_CHANNEL_SCORE_PENALTY:-}
      SIGNAL_COPY_FLOW_NO_TRADE_MARKET_BLOCK: ${SIGNAL_COPY_FLOW_NO_TRADE_MARKET_BLOCK:-true}
      SIGNAL_COPY_PRICE_CHASE_MARKET_BLOCK: ${SIGNAL_COPY_PRICE_CHASE_MARKET_BLOCK:-true}
      SIGNAL_COPY_PARSE_REPORT: ${SIGNAL_COPY_PARSE_REPORT:-false}
      SIGNAL_COPY_NOTIFY_REJECTED: ${SIGNAL_COPY_NOTIFY_REJECTED:-true}
      SIGNAL_COPY_NOTIFY_WEAK: ${SIGNAL_COPY_NOTIFY_WEAK:-true}
      SIGNAL_COPY_ADVERSARIAL_ENABLED: ${SIGNAL_COPY_ADVERSARIAL_ENABLED:-true}
      SIGNAL_COPY_ADVERSARIAL_MODE: ${SIGNAL_COPY_ADVERSARIAL_MODE:-off}
      SIGNAL_COPY_COMMITTEE_ENABLED: ${SIGNAL_COPY_COMMITTEE_ENABLED:-false}
      SIGNAL_COPY_COMMITTEE_MODE: ${SIGNAL_COPY_COMMITTEE_MODE:-shadow}
      SIGNAL_COPY_COMMITTEE_LLM_ENABLED: ${SIGNAL_COPY_COMMITTEE_LLM_ENABLED:-false}
      SIGNAL_COPY_COMMITTEE_LEGACY_COMPARE: ${SIGNAL_COPY_COMMITTEE_LEGACY_COMPARE:-true}
      SIGNAL_COPY_COMMITTEE_RUN_ON_VERDICTS: ${SIGNAL_COPY_COMMITTEE_RUN_ON_VERDICTS:-VALID,WEAK}
      SIGNAL_COPY_COMMITTEE_SOFT_FLOOR: ${SIGNAL_COPY_COMMITTEE_SOFT_FLOOR:-90}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_BASE: ${NINE_ROUTER_BASE:-http://host.docker.internal:20128/v1}
      ADVERSARIAL_MODEL: ${ADVERSARIAL_MODEL:-Free-Tiers}
      ADVERSARIAL_MODEL_FALLBACK: ${ADVERSARIAL_MODEL_FALLBACK:-Free-Tiers}
      ADV_LLM_TIMEOUT_SEC: ${ADV_LLM_TIMEOUT_SEC:-25}
      SIGNAL_COPY_VISION_ENABLED: ${SIGNAL_COPY_VISION_ENABLED:-false}
      SIGNAL_COPY_VISION_BACKEND: ${SIGNAL_COPY_VISION_BACKEND:-openai}
      SIGNAL_COPY_VISION_OPENAI_BASE_URL: ${SIGNAL_COPY_VISION_OPENAI_BASE_URL:-http://host.docker.internal:20128/v1}
      SIGNAL_COPY_VISION_OPENAI_API_KEY: ${SIGNAL_COPY_VISION_OPENAI_API_KEY:-}
      SIGNAL_COPY_VISION_OPENAI_MODEL: ${SIGNAL_COPY_VISION_OPENAI_MODEL:-gc/gemini-2.5-pro}
      SIGNAL_COPY_VISION_TIMEOUT_SEC: ${SIGNAL_COPY_VISION_TIMEOUT_SEC:-300}
      SIGNAL_COPY_PENDING_JOURNAL: /state/pending_lifecycle.jsonl
      SIGNAL_COPY_LIFECYCLE_JOURNAL: /state/signal_lifecycle.jsonl
      SIGNAL_COPY_COMMITTEE_DECISION_JOURNAL: /state/committee_decisions.jsonl
      SIGNAL_COPY_COMMITTEE_OUTCOME_JOURNAL: /state/committee_outcomes.jsonl
      SIGNAL_COPY_CHANNEL_PERFORMANCE_STORE: /state/channel_performance.json
      SIGNAL_COPY_OUTCOME_STORE: /state/signal_outcomes.json
    volumes:
      - ./runtime/state:/state
      - ./runtime/logs:/logs
      - ./runtime/revo:/app/runtime/revo:ro
      - ./runtime/whales:/app/runtime/whales:ro
      - ./journal:/app/journal
      - ./signal_copy:/app/signal_copy
      - ./execution:/app/execution
      - ./gateway:/app/gateway
      - ./nexus:/app/nexus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - docker_default

networks:
  docker_default:
    external: true
